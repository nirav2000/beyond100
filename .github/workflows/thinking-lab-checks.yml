name: Maths Thinking Lab checks
on:
  push:
    paths:
      - 'thinking-lab/**'
      - 'preview-bridge.js'
      - '.github/workflows/thinking-lab-checks.yml'
  pull_request:
    paths:
      - 'thinking-lab/**'
      - 'preview-bridge.js'
      - '.github/workflows/thinking-lab-checks.yml'
permissions:
  contents: read
jobs:
  thinking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check preview-bridge.js
          find thinking-lab -name '*.mjs' -exec node --check '{}' ';'
      - name: Test structural reasoning
        run: node --test thinking-lab/tests/*.test.mjs

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test (phone and desktop)
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/beyond100-lab-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          node thinking-lab/tests/browser-smoke.mjs
          node thinking-lab/tests/guided-browser.mjs
