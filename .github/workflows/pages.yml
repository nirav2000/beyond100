name: Deploy Beyond 100 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require semantic version bump on every push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const before = process.env.BEFORE_SHA;
          if (!before || /^0+$/.test(before)) {
            console.log('No prior push revision available; skipping version comparison.');
            process.exit(0);
          }

          const currentText = fs.readFileSync('versions-data.js', 'utf8');
          const previousText = execFileSync('git', ['show', `${before}:versions-data.js`], { encoding: 'utf8' });

          const getVersion = text => {
            const m = text.match(/currentVersion:\s*'([^']+)'/);
            if (!m) throw new Error('Could not read currentVersion from versions-data.js');
            return m[1];
          };
          const parse = value => {
            const m = value.match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/);
            if (!m) throw new Error(`Invalid SemVer: ${value}`);
            return m.slice(1, 4).map(Number);
          };
          const greater = (a,b) => a[0] > b[0] || (a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] > b[2])));

          const previous = getVersion(previousText);
          const current = getVersion(currentText);
          if (!greater(parse(current), parse(previous))) {
            throw new Error(`Every push to main must increase currentVersion. Previous: ${previous}; pushed: ${current}`);
          }
          console.log(`Version bump verified: ${previous} -> ${current}`);
          NODE

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check assessment-data.js
          node --check assessment.js
          node --check cloud-config.js
          node --check learner-profile.js
          node --check learner-context.js
          node --check topic-context.js
          node --check notes-auto-anchors.js
          node --check focus-mode.js
          node --check guide.js
          node --check dashboard.js
          node --check parent.js
          node --check vendor/qrcode.min.js
          node --check learner-profile.js
          node --check notes.js
          node --check notes-ux.js
          node --check notes-advanced.js
          node --check learning-evidence-v07.js
          node --check review.js
          node --check review-feed-publisher.js
          node --check versions-data.js
          node --check versions-v05.js
          node --check version-current.js
          node --check preview-bridge.js

      - name: Validate release identity and current wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifestText = fs.readFileSync('versions-data.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const review = fs.readFileSync('review.html','utf8');
          const versionsHtml = fs.readFileSync('versions.html','utf8');
          const manifest = manifestText.match(/currentVersion:\s*'([^']+)'/);
          if (!manifest) throw new Error('Could not read currentVersion from versions-data.js');
          const current = manifest[1];
          if (!manifestText.includes(`version: '${current}'`)) throw new Error(`Current version ${current} is missing from release history`);
          for (const required of ['assessment-data.js','assessment.js','learner-profile.js','learner-context.js','topic-context.js','notes-auto-anchors.js','guide.js','dashboard.js','vendor/qrcode.min.js','focus-mode.js','notes-ux.js','notes-advanced.js','learning-evidence-v07.js','review-feed-publisher.js']) {
            if (!index.includes(required)) throw new Error(`index.html is not loading ${required}`);
          }
          for (const required of ['learning-evidence.css','learner-context.css','guide.css','focus-v09.css','dashboard.css']) {
            if (!index.includes(required)) throw new Error(`index.html is not loading ${required}`);
            if (!fs.existsSync(required)) throw new Error(`Missing ${required}`);
          }
          for (const required of ['review.css','review.js']) {
            if (!review.includes(required)) throw new Error(`review.html is not loading ${required}`);
          }
          if (!versionsHtml.includes('versions-v05.js')) throw new Error('Version Lab is not loading versions-v05.js');
          const parent = fs.readFileSync('parent.html','utf8');
          for (const required of ['parent.css','parent.js','cloud-config.js']) {
            if (!parent.includes(required)) throw new Error(`parent.html is not loading ${required}`);
          }
          if (!fs.existsSync('vendor/qrcode.min.js')) throw new Error('Missing local QR generator');
          console.log('Release identity:', current);
          NODE

      - name: Validate assessment assets
        run: |
          for n in 1 2 3 4 5 6 7; do
            test -s "assets/assessments/orley-summer-2026/page-$n.jpg" || { echo "Missing assessment page-$n.jpg"; exit 1; }
          done

      - name: Install UI smoke-test browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/beyond100-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test tests/ui-smoke.spec.cjs --reporter=line

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a             --exclude '.git/'             --exclude '.github/'             --exclude '_site/'             ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
