name: Deploy Beyond 100 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check assessment-data.js
          node --check assessment.js
          node --check cloud-config.js
          node --check topic-context.js
          node --check notes-auto-anchors.js
          node --check notes.js
          node --check notes-ux.js
          node --check notes-advanced.js
          node --check review.js
          node --check review-feed-publisher.js
          node --check versions-data.js
          node --check versions-v05.js
          node --check version-current.js
          node --check preview-bridge.js

      - name: Validate release identity and current wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifestText = fs.readFileSync('versions-data.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const review = fs.readFileSync('review.html','utf8');
          const versionsHtml = fs.readFileSync('versions.html','utf8');
          const manifest = manifestText.match(/currentVersion:\s*'([^']+)'/);
          if (!manifest) throw new Error('Could not read currentVersion from versions-data.js');
          const current = manifest[1];
          if (!manifestText.includes(`version: '${current}'`)) throw new Error(`Current version ${current} is missing from release history`);
          for (const required of ['assessment-data.js','assessment.js','topic-context.js','notes-auto-anchors.js','notes-ux.js','notes-advanced.js','review-feed-publisher.js']) {
            if (!index.includes(required)) throw new Error(`index.html is not loading ${required}`);
          }
          for (const required of ['review.css','review.js']) {
            if (!review.includes(required)) throw new Error(`review.html is not loading ${required}`);
          }
          if (!versionsHtml.includes('versions-v05.js')) throw new Error('Version Lab is not loading versions-v05.js');
          console.log('Release identity:', current);
          NODE

      - name: Validate assessment assets
        run: |
          for n in 1 2 3 4 5 6 7; do
            test -s "assets/assessments/orley-summer-2026/page-$n.jpg" || { echo "Missing assessment page-$n.jpg"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
