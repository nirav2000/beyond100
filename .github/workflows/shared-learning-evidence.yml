name: Shared learning evidence integration
on:
  pull_request:
    paths:
      - 'shared-learning-evidence.mjs'
      - 'learning-evidence-v07.js'
      - 'index.html'
      - '.github/workflows/shared-learning-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'shared-learning-evidence.mjs'
      - 'learning-evidence-v07.js'
      - '.github/workflows/shared-learning-evidence.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check shared-learning-evidence.mjs
          node --check learning-evidence-v07.js
          node --check app.js
          node --test thinking-lab/tests/*.test.mjs
      - run: |
          grep -q 'shared-learning-evidence.mjs' index.html
          grep -q 'beyond100-learning-evidence-saved' learning-evidence-v07.js
